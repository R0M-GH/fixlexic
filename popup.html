<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --fg: #1b1b1f; --muted: #6b6b76; --line: #e6e6ea; --accent: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c20; --fg: #ececf1; --muted: #9a9aa6; --line: #33333a; --accent: #6d9bff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 280px; padding: 14px 16px 16px;
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 15px; margin: 0 0 10px; letter-spacing: -0.01em; }
  h1 fx-b { font-weight: 800; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .host { color: var(--muted); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  label.slider { display: block; padding: 8px 0 2px; border-top: 1px solid var(--line); }
  label.slider span { display: flex; justify-content: space-between; }
  label.slider output { color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  .preview { margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; line-height: 1.5; }
  .preview fx-b { font-weight: var(--w, 700); }
  .note { margin-top: 8px; color: var(--muted); font-size: 12px; }
  kbd { font: inherit; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; }
</style>
</head>
<body>
  <h1><fx-b>Fix</fx-b>lexic</h1>

  <div class="row">
    <span>On everywhere</span>
    <input type="checkbox" id="enabled">
  </div>
  <div class="row">
    <span>On for <span class="host" id="host">this site</span></span>
    <input type="checkbox" id="site">
  </div>

  <label class="slider">
    <span>How much to bold <output id="ratioOut"></output></span>
    <input type="range" id="ratio" min="0.3" max="0.7" step="0.05">
  </label>
  <label class="slider">
    <span>Boldness <output id="weightOut"></output></span>
    <input type="range" id="weight" min="500" max="900" step="100">
  </label>

  <div class="preview" id="preview">Reading feels smoother when your eyes have an anchor at the start of every word.</div>
  <div class="note" id="note"><kbd>Alt</kbd>+<kbd>B</kbd> toggles the current site.</div>

  <script src="popup.js"></script>
</body>
</html>
